modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"
issueTrackerURL = "${mod_issues}"

[[mods]]
modId = "${neoforge_mod_id}"
version = "${version}"
displayName = "${mod_name}"
description = '''${mod_description}'''
authors = "${mod_author}"
logoFile = "assets/${mod_id}/icon.png"
displayURL = "${mod_homepage}"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${neoforge_mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${neoforge_mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${neoforge_mod_id}]]
modId = "tabbylib"
type = "required"
versionRange = "[${tabbylib_version},)"
ordering = "AFTER"
side = "CLIENT"
