# Every property used in resources must also be added to the props map in
# build-logic/src/main/groovy/multiloader-common.gradle.

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Mod
# Fabric allows "-" in mod ids, NeoForge only "_". Assets and translations use mod_id on both loaders.
mod_id=tabby-zoom
neoforge_mod_id=tabby_zoom
mod_name=Tabby Zoom
mod_version=2.0.0
mod_group=cc.avie.tabbyzoom
mod_author=Avie
mod_description=Hold C to zoom
mod_license=Avie Terms & Conditions 1.0
mod_homepage=https://avie.cc/
mod_sources=https://github.com/avie293/tabby-zoom/
mod_issues=https://github.com/avie293/avie-issues/issues
java_version=25

# Minecraft
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
# https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric - https://fabricmc.net/develop/
loom_version=1.19.4
fabric_loader_version=0.20.1
fabric_api_version=0.166.2+26.3

# NeoForge - https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.103
# https://projects.neoforged.net/neoforged/ModDevGradle
moddev_version=2.0.148

# Mixin (compile only in common, both loaders bundle these)
sponge_mixin_version=0.17.5+mixin.0.8.7
mixinextras_version=0.5.5

# TabbyLib - https://github.com/avie293/tabbylib
tabbylib_version=2.0.1
