# Done to increase the memory available to gradle (Loom and NeoForm both set up Minecraft).
org.gradle.jvmargs=-Xmx3G
# Loom needs Java 25+, the system default is Java 21 (GitHub Actions overrides this with its own JDK)
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Mod Properties
version=2.0.0
group=cc.avie.tabbyzoom
# Fabric allows "-" in mod ids, NeoForge only "_". Assets and translations keep using mod_id.
mod_id=tabby-zoom
neoforge_mod_id=tabby_zoom
mod_name=Tabby Zoom
mod_description=Hold C to zoom
mod_author=Avie
mod_license=Avie Terms & Conditions 1.0
java_version=25

minecraft_version=26.3

# Fabric
# check these on https://fabricmc.net/develop
fabric_loader_version=0.20.1
loom_version=1.19-SNAPSHOT
fabric_api_version=0.165.0+26.3

# NeoForge
# check these on https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.101
neo_form_version=26.3-1
moddev_version=2.0.148

# Dependencies
tabbylib_version=2.0.1
# Only for the mixin annotations in common
mixin_version=0.17.5+mixin.0.8.7
mixinextras_version=0.5.5
