plugins {
    id 'java-library'
}

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-${project.name}"
}

repositories {
    maven {
        name = 'Avie'
        url = 'https://avie.cc/maven'
        content {
            includeGroupAndSubgroups 'cc.avie'
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = java_version as int
}

tasks.withType(Jar).configureEach {
    def modId = mod_id
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${modId}" }
    }
}

processResources {
    var props = [
            version                : version,
            mod_id                 : mod_id,
            neoforge_mod_id        : neoforge_mod_id,
            mod_name               : mod_name,
            mod_author             : mod_author,
            mod_description        : mod_description,
            mod_license            : mod_license,
            mod_homepage           : mod_homepage,
            mod_sources            : mod_sources,
            mod_issues             : mod_issues,
            java_version           : java_version,
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            fabric_loader_version  : fabric_loader_version,
            neoforge_version       : neoforge_version,
            tabbylib_version       : tabbylib_version,
    ]
    inputs.properties props

    filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
        expand props
    }
}
