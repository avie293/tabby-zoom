pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'tabby-zoom'

// Code shared by all loaders, and one project per loader that builds the mod jar
include 'common'
include 'fabric'
include 'neoforge'
